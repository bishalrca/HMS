<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - Hospital Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Modular CSS -->
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <link rel="stylesheet" href="/static/css/appointment.css">
    <link rel="stylesheet" href="/static/css/footer.css">
</head>
<body>

<header class="header">
    <a href="/" class="logo"> <i class="fas fa-heartbeat"></i> <strong>Med_Minus</strong></a>
    <nav class="navbar">
        <a href="/">home</a>
        <a href="/pages/about.html">about</a>
        <a href="/pages/services.html">services</a>
        <a href="/pages/doctors.html">doctors</a>
        <a href="/pages/appointment.html" class="active">appointment</a>
        <a href="/pages/reviews.html">review</a>
        <a href="/pages/blogs.html">blogs</a>
    </nav>
    <div id="menu-btn" class="fas fa-bars"></div>
</header>

<div class="page-spacer"></div>

<section class="appointment" id="appointment">
    <h1 class="heading"> <span>Book </span>Appointment </h1>

    <div class="row">
        <div class="image">
            <img src="/image/appointment-img.svg" alt="Book Appointment">
        </div>

        <form id="appointment-form">
            <div class="message" style="display: none;"></div>
            <h3>make appointment</h3>
            <input type="text" name="name" placeholder="Your Full Name *" class="box" required>
            <input type="text" name="number" placeholder="Your Phone Number *" class="box" required autocomplete="tel">
            <input type="email" name="email" placeholder="Your Email Address (e.g. name@example.com) *" class="box" required autocomplete="email">
            <input type="date" name="date" class="box" required>
            <input type="submit" value="appointment now" class="btn">
        </form>
    </div>
</section>

<section class="footer">
    <div class="credit"> all rights reserved </div>
</section>

<script src="/static/js/api.js"></script>
<script src="/static/js/main.js"></script>
<script src="/static/js/appointment.js"></script>

</body>
</html>
