<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Hospital Management System</title>
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Modular CSS -->
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/header.css">
    
    <style>
        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            background: #fff;
            border: var(--border);
            box-shadow: var(--box-shadow);
            border-radius: .5rem;
            width: 100%;
            max-width: 42rem;
            padding: 3.5rem;
            text-align: center;
        }

        .login-card .logo {
            font-size: 3rem;
            color: var(--black);
            margin-bottom: .5rem;
            display: block;
        }

        .login-card .logo i {
            color: var(--green);
        }

        .login-card h2 {
            font-size: 2rem;
            color: var(--light-color);
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .login-card .box {
            width: 100%;
            margin: 1rem 0;
            border-radius: .5rem;
            border: var(--border);
            font-size: 1.6rem;
            color: var(--black);
            text-transform: none;
            padding: 1.2rem;
        }

        .login-card .btn {
            width: 100%;
            margin-top: 1.5rem;
            padding: 1.2rem;
            font-size: 1.8rem;
            text-align: center;
            font-weight: 600;
        }

        .error-alert {
            display: none;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: .5rem;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <a href="/" class="logo"> <i class="fas fa-heartbeat"></i> <strong>Med_Minus</strong></a>
    <h2>Admin Portal Authentication</h2>

    <div id="error-message" class="error-alert"></div>

    <form id="login-form">
        <input type="text" id="username" placeholder="Username" class="box" required autocomplete="username">
        <input type="password" id="password" placeholder="Password" class="box" required autocomplete="current-password">
        <button type="submit" id="login-btn" class="btn">Login to Dashboard <span class="fas fa-sign-in-alt"></span></button>
    </form>

    <div style="margin-top: 2rem;">
        <a href="/" style="font-size: 1.4rem; color: var(--green);"><i class="fas fa-arrow-left"></i> Return to Main Hospital Site</a>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // If already logged in, redirect straight to dashboard
        const user = await window.ApiService.getCurrentUser();
        if (user) {
            window.location.href = '/dashboard/';
            return;
        }

        const form = document.getElementById('login-form');
        const errorAlert = document.getElementById('error-message');
        const loginBtn = document.getElementById('login-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Authenticating...';

            const res = await window.ApiService.login(username, password);

            if (res.success) {
                window.location.href = '/dashboard/';
            } else {
                showError(res.error || 'Invalid credentials. Access denied.');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login to Dashboard <span class="fas fa-sign-in-alt"></span>';
            }
        });

        function showError(msg) {
            errorAlert.textContent = msg;
            errorAlert.style.display = 'block';
            setTimeout(() => {
                errorAlert.style.display = 'none';
            }, 5000);
        }
    });
</script>

</body>
</html>
