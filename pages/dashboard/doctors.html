<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Doctors | Med_Minus</title>
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Modular CSS -->
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <link rel="stylesheet" href="/static/css/doctors.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<header class="dashboard-header">
    <a href="/" class="brand"> <i class="fas fa-heartbeat"></i> <strong>Med_Minus</strong> | Admin Portal</a>
    
    <nav class="dashboard-nav">
        <a href="/dashboard/overview/"><button><i class="fas fa-chart-line"></i> Overview</button></a>
        <a href="/dashboard/appointments/"><button><i class="fas fa-calendar-check"></i> Appointments</button></a>
        <a href="/dashboard/doctors/"><button class="active"><i class="fas fa-user-md"></i> Doctors</button></a>
        <a href="/dashboard/blogs/"><button><i class="fas fa-blog"></i> Blogs</button></a>
        <a href="/dashboard/reviews/"><button><i class="fas fa-star"></i> Reviews</button></a>
        <span style="color: #fff; font-size: 1.4rem; align-self: center; margin-left: 1rem;"><i class="fas fa-user"></i> <strong id="admin-username">Admin</strong></span>
        <button onclick="handleLogout()" style="background: #e74c3c; color: #fff; border: none; padding: .6rem 1.2rem; font-size: 1.4rem; border-radius: .4rem; cursor: pointer;"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </nav>
</header>

<div class="dashboard-container">
    <div class="section-header">
        <h2>Manage Doctors List</h2>
        <button class="btn" onclick="openModal('doctor-modal')"><i class="fas fa-plus"></i> Add New Doctor</button>
    </div>

    <!-- Normal Data Table Layout -->
    <div class="table-responsive">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Photo</th>
                    <th>Doctor Name</th>
                    <th>Specialty</th>
                    <th>WhatsApp</th>
                    <th>LinkedIn</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="doctors-tbody">
                <!-- Populated by /static/js/dashboard.js -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal: Add New Doctor -->
<div id="doctor-modal" class="modal">
    <div class="modal-content">
        <h3>Add New Doctor Profile</h3>
        <form id="add-doctor-form">
            <input type="text" id="doc-name" placeholder="Doctor Name (e.g. Dr. Priya Sharma)" class="input-box" required>
            <input type="text" id="doc-specialty" placeholder="Specialty (e.g. CARDIOLOGIST)" class="input-box" required>
            <input type="text" id="doc-image" placeholder="Image Path (e.g. /image/doc-1.jpg)" class="input-box" value="/image/doc-1.jpg">
            <input type="text" id="doc-whatsapp" placeholder="WhatsApp Number (e.g. +9779841234567)" class="input-box">
            <input type="text" id="doc-linkedin" placeholder="LinkedIn Profile URL" class="input-box">
            <div class="modal-actions">
                <button type="button" class="action-btn btn-cancel" onclick="closeModal('doctor-modal')">Cancel</button>
                <button type="submit" class="action-btn btn-approve">Save Doctor</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Edit Doctor -->
<div id="edit-doctor-modal" class="modal">
    <div class="modal-content">
        <h3>Edit Doctor Profile</h3>
        <form id="edit-doctor-form">
            <input type="hidden" id="edit-doc-id">
            <label style="font-size: 1.4rem; color: var(--black); text-align: left; display: block; margin-top: .5rem;">Doctor Name:</label>
            <input type="text" id="edit-doc-name" placeholder="Doctor Name" class="input-box" required>
            
            <label style="font-size: 1.4rem; color: var(--black); text-align: left; display: block; margin-top: .5rem;">Specialty Name:</label>
            <input type="text" id="edit-doc-specialty" placeholder="Specialty Name" class="input-box" required>
            
            <label style="font-size: 1.4rem; color: var(--black); text-align: left; display: block; margin-top: .5rem;">Photo / Image Path:</label>
            <input type="text" id="edit-doc-image" placeholder="Photo Path (e.g. /image/doc-1.jpg)" class="input-box" required>
            
            <label style="font-size: 1.4rem; color: var(--black); text-align: left; display: block; margin-top: .5rem;">WhatsApp Number:</label>
            <input type="text" id="edit-doc-whatsapp" placeholder="WhatsApp Number (e.g. +9779841234567)" class="input-box">
            
            <label style="font-size: 1.4rem; color: var(--black); text-align: left; display: block; margin-top: .5rem;">LinkedIn Profile URL:</label>
            <input type="text" id="edit-doc-linkedin" placeholder="LinkedIn Profile URL" class="input-box">
            
            <div class="modal-actions">
                <button type="button" class="action-btn btn-cancel" onclick="closeModal('edit-doctor-modal')">Cancel</button>
                <button type="submit" class="action-btn btn-approve">Update Doctor</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/api.js?v=1.3"></script>
<script src="/static/js/dashboard.js?v=1.3"></script>
</body>
</html>
