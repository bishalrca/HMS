<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Overview | Med_Minus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<div class="dashboard-wrapper">
    <!-- Left Sidebar -->
    <aside class="sidebar">
        <div>
            <a href="/" class="brand"> <i class="fas fa-heartbeat"></i> <span>Med_Minus</span> </a>
            <nav class="sidebar-nav">
                <a href="/dashboard/overview/" class="active"><i class="fas fa-chart-line"></i> Overview</a>
                <a href="/dashboard/appointments/"><i class="fas fa-calendar-check"></i> Appointments</a>
                <a href="/dashboard/doctors/"><i class="fas fa-user-md"></i> Doctors</a>
                <a href="/dashboard/blogs/"><i class="fas fa-blog"></i> Blogs</a>
                <a href="/dashboard/reviews/"><i class="fas fa-star"></i> Reviews</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <div class="user-info"><i class="fas fa-user-circle"></i> Admin: <strong id="admin-username">Admin</strong></div>
            <button onclick="handleLogout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
            <a href="/" style="display: block; text-align: center; color: rgba(255,255,255,.8); margin-top: 1rem; font-size: 1.3rem;"><i class="fas fa-globe"></i> Main Hospital Site</a>
        </div>
    </aside>

    <!-- Main Content Panel -->
    <main class="main-content">
        <div class="section-header">
            <h2>Hospital Analytics Overview</h2>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-user-md"></i>
                <h3 id="stat-doctors">0</h3>
                <p>Active Doctors</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-calendar-alt"></i>
                <h3 id="stat-appointments">0</h3>
                <p>Total Appointments</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <h3 id="stat-pending">0</h3>
                <p>Pending Approvals</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-check-circle"></i>
                <h3 id="stat-confirmed">0</h3>
                <p>Confirmed Appointments</p>
            </div>
        </div>
    </main>
</div>

<script src="/static/js/api.js?v=1.4"></script>
<script src="/static/js/dashboard.js?v=1.4"></script>
</body>
</html>
