<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Appointment - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<div class="dashboard-wrapper">
    <aside class="sidebar">
        <div>
            <a href="/" class="brand"> <i class="fas fa-heartbeat"></i> <span>Med_Minus</span> </a>
            <nav class="sidebar-nav">
                <a href="/dashboard/overview/"><i class="fas fa-chart-line"></i> Overview</a>
                <a href="/dashboard/appointments/" class="active"><i class="fas fa-calendar-check"></i> Appointments</a>
                <a href="/dashboard/doctors/"><i class="fas fa-user-md"></i> Doctors</a>
                <a href="/dashboard/blogs/"><i class="fas fa-blog"></i> Blogs</a>
                <a href="/dashboard/reviews/"><i class="fas fa-star"></i> Reviews</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <button onclick="handleLogout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="section-header">
            <h2>Edit Appointment Record</h2>
            <a href="/dashboard/appointments/" class="action-btn btn-cancel"><i class="fas fa-arrow-left"></i> Back to List</a>
        </div>

        <div class="admin-form-card">
            <form id="appointment-edit-form" data-appointment-id="{{ id }}">
                <div class="form-group">
                    <label>Patient Name:</label>
                    <input type="text" id="appt-name" name="name" class="input-box" required>
                </div>
                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="text" id="appt-number" name="number" class="input-box" required>
                </div>
                <div class="form-group">
                    <label>Email Address:</label>
                    <input type="email" id="appt-email" name="email" class="input-box" required>
                </div>
                <div class="form-group">
                    <label>Appointment Date:</label>
                    <input type="date" id="appt-date" name="date" class="input-box" required>
                </div>
                <div class="form-group">
                    <label>Appointment Status:</label>
                    <select id="appt-status" name="status" class="input-box" required>
                        <option value="PENDING">Pending</option>
                        <option value="CONFIRMED">Confirmed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>

                <div class="form-actions">
                    <a href="/dashboard/appointments/" class="action-btn btn-cancel">Cancel</a>
                    <button type="submit" class="action-btn btn-approve">Update Appointment</button>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="/static/js/api.js?v=1.4"></script>
<script src="/static/js/dashboard.js?v=1.4"></script>
<script src="/static/js/dashboard_forms.js?v=1.4"></script>
<script>
    const pathParts = window.location.pathname.split('/');
    const apptId = pathParts[pathParts.length - 2] || pathParts[pathParts.length - 1];
    document.getElementById('appointment-edit-form').setAttribute('data-appointment-id', apptId);
</script>
</body>
</html>
